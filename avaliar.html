<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Avalie sua estadia · Terra Dourada</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--sand:#f4efe6;--sand2:#ebe2d2;--paper:#fbf8f2;--ink:#27231d;--mute:#6d6458;--line:#ddd2bf;--forest:#2f3a26;--gold:#b8955a;--rose:#b07d72;--rose2:#ecd9d2;--moss:#55623f;--moss2:#dfe3d2;--serif:Gloock,Georgia,serif;--sans:"Instrument Sans",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--sand);color:var(--ink);font:16px/1.6 var(--sans)}
a{color:inherit}
.top{padding:22px max(5vw,18px);display:flex;justify-content:center}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo svg{width:34px;height:34px}
.logo b{font:400 22px/1 var(--serif);display:block}.logo small{font-size:12px;opacity:.75}
main{max-width:620px;margin:0 auto;padding:10px max(5vw,18px) 64px}
.card{background:var(--paper);border-radius:22px;padding:clamp(24px,5vw,40px);box-shadow:0 30px 60px -44px rgba(47,58,38,.5);border-top:4px solid var(--acc,var(--gold))}
.rosa{--acc:var(--rose);--acc2:var(--rose2)}.moss{--acc:var(--moss);--acc2:var(--moss2)}
.tag{display:inline-flex;padding:7px 14px;border-radius:999px;background:var(--acc2,var(--sand2));font-size:13px;font-weight:600}
h1{font:400 clamp(32px,6vw,42px)/1.06 var(--serif);margin:16px 0 8px;letter-spacing:-.01em}
p.sub{color:var(--mute);margin:0}
form{display:grid;gap:20px;margin-top:28px}
label.f{display:grid;gap:6px;font-size:14px;font-weight:600}
label.f small{font-weight:400;color:var(--mute)}
input[type=text],input[type=month],textarea{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:12px 14px;font:500 16px var(--sans);color:var(--ink)}
textarea{min-height:150px;resize:vertical;line-height:1.55}
input:focus,textarea:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 3px rgba(79,90,58,.15)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
fieldset{border:0;padding:0;margin:0}
legend{font-size:14px;font-weight:600;margin-bottom:8px}
.stars{display:flex;gap:6px}
.stars input{position:absolute;opacity:0;pointer-events:none}
.stars label{cursor:pointer;width:48px;height:48px;display:grid;place-items:center;border-radius:12px;color:#d6ccb9;transition:color .2s,transform .2s}
.stars label svg{width:34px;height:34px}
.stars label.on{color:var(--gold)}
.stars label:hover{transform:scale(1.08)}
.stars input:focus-visible+label{outline:2px solid var(--gold);outline-offset:2px}
.count{font-size:13px;color:var(--mute);text-align:right;margin-top:-14px}
.chk{display:grid;grid-template-columns:22px 1fr;gap:12px;font-size:15px;align-items:start;cursor:pointer}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--forest)}
.err{color:#a23b2a;font-size:14px;font-weight:500}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;border-radius:999px;border:0;background:var(--forest);color:#fff;font:600 16px var(--sans);text-decoration:none;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.btn.light{background:transparent;color:var(--forest);border:1px solid var(--forest)}
.center{text-align:center}
.center .btn{margin-top:22px}
.msg{padding:14px 16px;border-radius:12px;background:#f6e3df;color:#7d2c20;font-size:15px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
footer{text-align:center;font-size:13px;color:var(--mute);padding:0 18px 32px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-sun" viewBox="0 0 40 40"><circle cx="20" cy="22" r="8" fill="#b8955a"/><g stroke="#b8955a" stroke-width="1.6" stroke-linecap="round"><path d="M20 6v5M8.7 10.7l3.5 3.5M31.3 10.7l-3.5 3.5M4 22h5M31 22h5"/></g><path d="M3 27c6-3 11-3 17 0s11 3 17 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3 32c6-3 11-3 17 0s11 3 17 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".55"/></symbol>
 <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></symbol>
</svg>
<div class="top"><a class="logo" href="/"><svg><use href="#i-sun"/></svg><span><b>Terra Dourada</b><small>Brasília · Lago Oeste</small></span></a></div>
<main><div class="card" id="box"><p class="sub">Carregando…</p></div></main>
<footer>Seus dados são tratados conforme a <a href="/privacidade">política de privacidade</a>.</footer>

<script>
{
const $=s=>document.querySelector(s), box=$('#box');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=new URLSearchParams(location.search).get('convite')||'';
const IG='https://www.instagram.com/terradouradabrasilia/';
const mesAtual=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
const cls=c=>c==='casa-rosa'?'rosa':'moss';

function aviso(titulo,texto){
 box.innerHTML=`<div class="center"><h1>${titulo}</h1><p class="sub">${texto}</p><a class="btn light" href="/">Ir para o site</a></div>`;
}

async function iniciar(){
 if(!token) return aviso('Link incompleto','Use o link de avaliação que você recebeu da equipe da Terra Dourada.');
 let d;
 try{ const r=await fetch('/api/convite?token='+encodeURIComponent(token)); d=await r.json(); }catch(e){ return aviso('Sem conexão','Não foi possível abrir o formulário agora. Tente novamente em instantes.'); }
 if(d.status==='usado') return aviso('Avaliação já enviada','Este link já foi usado. Obrigado por compartilhar sua experiência!');
 if(d.status!=='ok') return aviso('Link inválido','Este link de avaliação não existe ou expirou. Fale com a equipe da Terra Dourada para receber um novo.');
 form(d);
}

function form(d){
 box.className='card '+cls(d.casa);
 box.innerHTML=`
 <span class="tag">${esc(d.casaNome)}</span>
 <h1>Como foi sua estadia${d.nome?`, ${esc(d.nome)}`:''}?</h1>
 <p class="sub">Sua opinião ajuda outros hóspedes a escolher e nos ajuda a cuidar cada vez melhor da casa. Leva cerca de 1 minuto.</p>
 <form id="f" novalidate>
  <fieldset><legend>Sua nota</legend><div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<input type="radio" name="nota" id="n${n}" value="${n}"><label for="n${n}" aria-label="${n} ${n>1?'estrelas':'estrela'}"><svg><use href="#i-star"/></svg></label>`).join('')}</div><div class="err" data-e="nota"></div></fieldset>
  <label class="f">Conte como foi<textarea name="texto" maxlength="1200" placeholder="O que você mais gostou? Como foi a recepção, a casa, a piscina, a vista…"></textarea><span class="err" data-e="texto"></span></label>
  <div class="count" id="cnt">0 / 1200</div>
  <div class="row">
   <label class="f">Como quer aparecer<input type="text" name="nome" maxlength="40" value="${esc(d.nome)}" placeholder="Ex.: Ana ou Ana S." autocomplete="given-name"><span class="err" data-e="nome"></span></label>
   <label class="f"><span>Cidade <small>(opcional)</small></span><input type="text" name="cidade" maxlength="40" placeholder="Ex.: Brasília, DF" autocomplete="address-level2"></label>
  </div>
  <label class="f">Mês da estadia<input type="month" name="mes" value="${esc(d.mes||mesAtual())}" max="${mesAtual()}"><span class="err" data-e="mes"></span></label>
  <div class="hp" aria-hidden="true"><label>Site<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
  <label class="chk"><input type="checkbox" name="publicar" checked><span>Autorizo a Terra Dourada a publicar esta avaliação no site, com o nome e a cidade que informei.</span></label>
  <label class="chk"><input type="checkbox" name="privacidade"><span>Li e aceito a <a href="/privacidade" target="_blank" rel="noopener">política de privacidade</a>.</span></label>
  <div class="err" data-e="privacidade"></div>
  <div class="err" id="geral" role="alert"></div>
  <button class="btn" type="submit" id="ok">Enviar avaliação</button>
 </form>`;
 const f=$('#f'), labels=[...f.querySelectorAll('.stars label')];
 const pinta=n=>labels.forEach((l,i)=>l.classList.toggle('on',i<n));
 f.addEventListener('change',e=>{ if(e.target.name==='nota') pinta(+e.target.value); });
 labels.forEach((l,i)=>{ l.onmouseenter=()=>pinta(i+1); l.onmouseleave=()=>pinta(+(f.nota.value||0)); });
 f.texto.addEventListener('input',()=>{$('#cnt').textContent=`${f.texto.value.length} / 1200`});
 f.addEventListener('input',e=>{const n=e.target.name; const el=n&&f.querySelector(`[data-e="${n}"]`); if(el) el.textContent='';});
 f.addEventListener('change',e=>{const n=e.target.name; const el=n&&f.querySelector(`[data-e="${n}"]`); if(el) el.textContent='';});
 f.addEventListener('submit',async e=>{
  e.preventDefault();
  f.querySelectorAll('[data-e]').forEach(x=>x.textContent=''); $('#geral').textContent='';
  const dados={token,nota:Number(f.nota.value||0),texto:f.texto.value,nome:f.nome.value,cidade:f.cidade.value,mes:f.mes.value,publicar:f.publicar.checked,privacidade:f.privacidade.checked,website:f.website.value};
  const erros={};
  if(!dados.nota) erros.nota='Escolha uma nota de 1 a 5 estrelas.';
  if(dados.texto.trim().length<20) erros.texto='Conte um pouco mais (mínimo de 20 caracteres).';
  if(dados.nome.trim().length<2) erros.nome='Informe como você quer aparecer.';
  if(!dados.mes) erros.mes='Escolha o mês da sua estadia.';
  if(!dados.privacidade) erros.privacidade='É preciso aceitar a política de privacidade para enviar.';
  if(Object.keys(erros).length){ Object.entries(erros).forEach(([k,v])=>{const el=f.querySelector(`[data-e="${k}"]`); if(el) el.textContent=v}); return; }
  const b=$('#ok'); b.disabled=true; b.textContent='Enviando…';
  try{
   const r=await fetch('/api/avaliacoes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});
   const j=await r.json().catch(()=>({}));
   if(j.ok){ box.innerHTML=`<div class="center"><h1>Obrigado!</h1><p class="sub">Recebemos sua avaliação. Ficamos muito felizes em ter você na ${esc(d.casaNome)} e esperamos te receber de novo.</p><a class="btn" href="${IG}" target="_blank" rel="noopener">Seguir no Instagram</a><br><a class="btn light" href="/" style="margin-top:12px">Voltar ao site</a></div>`; return; }
   if(j.erros) Object.entries(j.erros).forEach(([k,v])=>{const el=f.querySelector(`[data-e="${k}"]`); if(el) el.textContent=v});
   const m={convite_usado:'Este link já foi usado.',convite_invalido:'Este link não é mais válido.',muitas_tentativas:'Muitas tentativas. Aguarde alguns minutos e tente de novo.',nao_configurado:'O envio de avaliações ainda não foi ativado. Avise a equipe da Terra Dourada.'};
   $('#geral').textContent=m[j.code]||(j.erros?'':'Não foi possível enviar agora. Tente novamente.');
  }catch(err){ $('#geral').textContent='Sem conexão. Verifique a internet e tente de novo.'; }
  b.disabled=false; b.textContent='Enviar avaliação';
 });
}
iniciar();
}
</script>
</body>
</html>
